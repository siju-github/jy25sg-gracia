<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Completed</title>
  <script>
    (function() {
      var payload = {
        type: 'HITPAY_PAYMENT_SUCCESS',
        status: 'completed',
        timestamp: Date.now()
      };

      // Notify parent window if open
      if (window.opener && !window.opener.closed) {
        try {
          window.opener.postMessage({ type: 'HITPAY_PAYMENT_SUCCESS', status: 'completed' }, '*');
          window.opener.postMessage({ type: 'HITPAY_PAYMENT_RETURN', status: 'completed' }, '*');
        } catch (e) {
          console.error('PostMessage error:', e);
        }
      }

      // Also notify via localStorage for mobile & cross-tab sync
      try {
        localStorage.setItem('hitpay_payment_success', JSON.stringify(payload));
        localStorage.setItem('hitpay_last_return', JSON.stringify(payload));
      } catch (e) {}

      // Automatically close the popup window immediately
      try {
        window.close();
      } catch (e) {}

      // Fallback auto-close after brief moment
      setTimeout(function() {
        try { window.close(); } catch (e) {}
      }, 500);
    })();
  </script>
</head>
<body style="background:#0f172a; color:#fff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; text-align:center;">
  <div style="background:#1e293b; border:1px solid #334155; border-radius:16px; padding:32px; max-width:420px; width:90%; box-shadow:0 20px 25px -5px rgba(0,0,0,0.5);">
    <div style="width:48px; height:48px; border-radius:50%; background:rgba(16,185,129,0.15); color:#10b981; display:flex; align-items:center; justify-content:center; margin:0 auto 16px; font-size:24px; font-weight:bold;">✓</div>
    <h2 style="color:#10b981; margin:0 0 8px; font-size:20px; font-weight:700;">✓ Payment Processed</h2>
    <p style="color:#94a3b8; font-size:14px; margin:0 0 20px; line-height:1.5;">You can return to the registration window. This window will close automatically.</p>
    <button onclick="window.close()" style="background:#4f46e5; color:#fff; border:none; padding:10px 24px; border-radius:8px; font-weight:600; cursor:pointer; font-size:14px;">
      Close Window
    </button>
  </div>
</body>
</html>
